<style>
*{box-sizing:border-box;}
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;

}

.card {

  max-width: 450px;
  padding: 32px 30px;
  border-radius: 14px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, .25);

}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
h1{text-align:center;color:#203a43;font-size:20px;margin-bottom:6px;}
h2{text-align:center;color:#555;font-size:15px;margin-bottom:22px;}
label{font-weight:600;margin-top:14px;display:block;}
input{
  width:100%;padding:10px 12px;margin-top:6px;
  border-radius:6px;border:1px solid #ccc;font-size:15px;
}
button{
  margin-top:26px;width:100%;padding:12px;
  background:linear-gradient(135deg,#2c5364,#203a43);
  color:#fff;border:none;font-size:16px;
  font-weight:600;border-radius:30px;cursor:pointer;
}
button:disabled{background:#999;cursor:not-allowed;}
.msg{text-align:center;margin-top:18px;font-weight:600;}
.loader{
  border:4px solid #f3f3f3;
  border-top:4px solid #2c5364;
  border-radius:50%;
  width:32px;height:32px;
  margin:10px auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
.register{text-align:center;margin-top:12px;font-size:13px;}
.register a{color:#2c5364;font-weight:600;text-decoration:none;}
.footer{
  margin-top:26px;
  text-align:center;
  font-size:13px;
  color:#5f6f78;
  font-weight:600;
}
.footer div{
  font-size:12px;
  color:#7a8a93;
}
.faculty-box{margin-top:14px;}
.faculty-btn{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#f39c12,#e67e22);
  color:#fff;
  border:none;
  font-size:16px;
  font-weight:600;
  border-radius:30px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(230,126,34,.35);
  transition:transform .15s ease, box-shadow .15s ease;
}
.faculty-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(230,126,34,.45);
}
  
/* ===== Modern Rotating Update Banner ===== */

.update-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 66px;
  padding: 11px 12px;
  margin-bottom: 20px;

  background: linear-gradient(
    110deg,
    #eff6ff,
    #e0f2fe,
    #f0fdfa,
    #eff6ff
  );
  background-size: 250% 250%;
  border: 1px solid #bfdbfe;
  border-radius: 13px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.09);

  animation: updateGradient 7s ease infinite;
  overflow: hidden;
}

@keyframes updateGradient {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.update-icon {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #2563eb;
  border-radius: 11px;
  box-shadow: 0 3px 8px rgba(37, 99, 235, 0.2);
}

.update-icon span {
  font-size: 18px;
  animation: bellPulse 2s ease-in-out infinite;
}

@keyframes bellPulse {
  0%, 100% { transform: rotate(0deg); }
  10%, 30% { transform: rotate(-10deg); }
  20%, 40% { transform: rotate(10deg); }
  50% { transform: rotate(0deg); }
}

.update-content {
  flex: 1;
  min-width: 0;
}

.update-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;

  color: #1d4ed8;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.8px;
}

.update-badge {
  padding: 3px 7px;
  background: #dcfce7;
  color: #15803d;
  border-radius: 5px;

  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.3px;

  animation: badgePulse 2s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  50% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12); }
}

.update-message {
  color: #0f172a;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
  overflow-wrap: anywhere;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.update-message.fade-out {
  opacity: 0;
  transform: translateY(-5px);
}

.update-message.fade-in {
  opacity: 1;
  transform: translateY(0);
}

.update-indicator {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
  margin-left: 2px;
}

.update-indicator span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #93c5fd;
  transition: background 0.2s ease, transform 0.2s ease;
}

.update-indicator span.active {
  background: #2563eb;
  transform: scale(1.35);
}

/* Small-screen adjustments */
@media (max-width: 360px) {
  .update-banner {
    gap: 8px;
    padding: 10px;
    min-height: 68px;
  }

  .update-icon {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
  }

  .update-message {
    font-size: 12px;
  }
}

</style>
</head>

<body>


<div class="card">

  <!-- Rotating Course Updates -->
  <div class="update-banner" id="updateBanner"
       role="status" aria-live="polite">

    <div class="update-icon">
      <span>🔔</span>

    <div class="update-content">
      <div class="update-heading">
        <span>WHAT'S NEW</span>
        <span class="update-badge">NEW</span>
      </div>

      <div class="update-message" id="updateMessage">
        New mock test is available!
      </div>
    </div>

    <div class="update-indicator" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

  <h1>Student Login</h1>

  <h2>AI & ML Applications in Mechanical Engineering (ME4127)</h2>

  <label>Roll Number</label>
  <input id="roll">

  <label>Date of Birth</label>
  <input type="date" id="dob">

  <button id="loginBtn" onclick="login()">Login</button>

  <div class="msg" id="msg"></div>

  <div class="register">
    Not registered?
    <a href="https://me4127-2026.github.io/Regn/">
      Click here to register
    </a>
  </div>

  <div class="faculty-box">
    <button class="faculty-btn" onclick="facultyLogin()">
      Faculty Login
    </button>
  </div>

  <div class="footer">
    Developed by Dr. Rajesh Akula
    <div>© 2026 · IIEST Shibpur</div>
  </div>
</div>
<script src="config.js"></script>
<script>
  if(sessionStorage.getItem("token")){
  window.location.href = "SDB.html"; // or dashboard.html
}
const BACKEND = BACKEND_URL;
  
/* ===== Automatically Rotating Course Updates ===== */

// Edit these messages whenever a new announcement is needed.
const courseUpdates = [
  "New mock test is available!",
  "Prepare for your upcoming class tests."
];

let currentUpdate = 0;
let updateTimer = null;

const updateMessage = document.getElementById("updateMessage");
const updateBanner = document.getElementById("updateBanner");
const updateDots = document.querySelectorAll(".update-indicator span");

function showCourseUpdate(index) {
  if (!updateMessage) return;

  updateMessage.classList.remove("fade-in");
  updateMessage.classList.add("fade-out");

  setTimeout(() => {
    currentUpdate = index;

    updateMessage.textContent = courseUpdates[currentUpdate];

    updateDots.forEach((dot, i) => {
      dot.classList.toggle("active", i === currentUpdate % updateDots.length);
    });

    updateMessage.classList.remove("fade-out");
    updateMessage.classList.add("fade-in");
  }, 250);
}

function startUpdateRotation() {
  if (!updateMessage || courseUpdates.length < 2) return;

  // Highlight the first update initially.
  updateDots.forEach((dot, i) => {
    dot.classList.toggle("active", i === 0);
  });

  // Rotate every 4 seconds.
  updateTimer = setInterval(() => {
    const nextUpdate = (currentUpdate + 1) % courseUpdates.length;
    showCourseUpdate(nextUpdate);
  }, 3000);
}

function stopUpdateRotation() {
  if (updateTimer !== null) {
    clearInterval(updateTimer);
    updateTimer = null;
  }
}

// Pause rotation when the page is hidden.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopUpdateRotation();
  } else if (updateTimer === null) {
    startUpdateRotation();
  }
});

startUpdateRotation();

function login(){
  const roll=document.getElementById("roll").value.trim().toUpperCase();
  const dob=document.getElementById("dob").value;
  const msg=document.getElementById("msg");
  const btn=document.getElementById("loginBtn");

  if(!roll||!dob){
    msg.style.color="red";
    msg.innerText="Enter Roll Number and DOB";
    return;
  }

  btn.disabled=true;
  msg.innerHTML='<div class="loader"></div>Authenticating…';

  fetch(BACKEND,{
  method:"POST",
  body:new URLSearchParams({
    action:"login",
    roll: roll,
    dob: dob
  })
})
  .then(r=>r.json())
  .then(res=>{
  if(res.status === "OK" && res.token){
    sessionStorage.setItem("token", res.token);
    window.location.href = "SDB.html";
    return;
  }

  msg.style.color = "red";

  if(res.status === "DOB_MISMATCH"){
    msg.innerText = "DOB is incorrect. Please try again.";
  }
  else if(res.status === "NOT_REGISTERED"){
    msg.innerHTML =
      'You are not registered. ' +
      '<a href="../Regn/">Register here</a>';
  }
  else{
    msg.innerText = "Login failed. Please try again.";
  }

  btn.disabled = false;
})
  .catch(()=>{
    msg.style.color="red";
    msg.innerText="Server error";
    btn.disabled=false;
  });
}

function facultyLogin(){
  window.location.href="faculty_login.html";
}
</script>

</body>
